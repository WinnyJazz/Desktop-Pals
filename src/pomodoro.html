<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Caacupe+One&family=Tiny5&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/global.css">
    <title>Pomodoro</title>
</head>
<body>
    <div id="navbar"></div>
    
    <!-- im trying bootstrap tehee -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0 text-center">Countdown Timer</h4>
                    </div>
                    <div class="card-body">
                        <div class="row text-center">
                            <div class="col-3">
                                <h3 id="days" class="display-4">00</h3>
                                <p>Days</p>
                            </div>
                            <div class="col-3">
                                <h3 id="hours" class="display-4">00</h3>
                                <p>Hours</p>
                            </div>
                            <div class="col-3">
                                <h3 id="minutes" class="display-4">00</h3>
                                <p>Minutes</p>
                            </div>
                            <div class="col-3">
                                <h3 id="seconds" class="display-4">00</h3>
                                <p>Seconds</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    </div>

    <script src="js/global.js"></script>
    
</body>
</html>
